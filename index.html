<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>বাকির খাতা</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280;
  --border: #e5e7eb; --primary: #0F766E; --primary-hover: #0d655e;
  --primary-soft: #ccfbf1; --red: #dc2626; --red-soft: #fee2e2;
  --green: #059669; --green-soft: #d1fae5; --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
  --nav-bg: rgba(255, 255, 255, 0.95);
}
[data-theme="dark"] {
  --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8;
  --border: #334155; --primary: #14b8a6; --primary-soft: #134e4a;
  --red: #f87171; --red-soft: #451a1a; --green: #34d399; --green-soft: #064e3b;
  --nav-bg: rgba(30, 41, 59, 0.95);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Sans Bengali', sans-serif; background: var(--bg); color: var(--text); margin: 0; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
#app { max-width: 600px; margin: 0 auto; padding: 16px 16px 90px; min-height: 100vh; }
.hide { display: none !important; }
h2, h3, p { margin: 0; }
.muted { color: var(--muted); font-size: 13px; font-weight: 500; }
.text-red { color: var(--red) !important; } .text-green { color: var(--green) !important; } .text-center { text-align: center; }
.mt-2 { margin-top: 8px; } .mt-4 { margin-top: 16px; } .mb-2 { margin-bottom: 8px; } .mb-4 { margin-bottom: 16px; }
.flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
.card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; border: 1px solid var(--border); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.stat-card { background: var(--card); padding: 16px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.stat-val { font-size: 24px; font-weight: 700; margin-top: 4px; }
.input { width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 16px; font-weight: 500; outline: none; transition: border 0.2s; }
.input:focus { border-color: var(--primary); background: var(--card); }
label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.form-group { margin-bottom: 16px; }
.btn { border: none; border-radius: 12px; padding: 14px 20px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s, opacity 0.1s; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-danger { background: var(--red-soft); color: var(--red); border: 1px solid var(--red); }
.btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-success { background: var(--green); color: #fff; }
.btn-block { width: 100%; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-top: 8px; }
.logo { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--nav-bg); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); z-index: 100; }
.nav-item { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; padding: 4px 12px; border-radius: 12px; transition: color 0.2s; }
.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 22px; margin-bottom: 2px; }
.list-item { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--card); border-radius: 16px; margin-bottom: 10px; box-shadow: var(--shadow); border: 1px solid var(--border); cursor: pointer; transition: background 0.2s; }
.list-item:active { background: var(--bg); }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; flex-shrink: 0; }
.item-content { flex: 1; min-width: 0; }
.item-title { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-sub { color: var(--muted); font-size: 13px; font-weight: 500; }
.item-right { text-align: right; font-weight: 700; font-size: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.tx-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
.tx-row:last-child { border-bottom: none; }
.tx-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 700; display: inline-block; margin-bottom: 4px; }
.badge-credit { background: var(--red-soft); color: var(--red); } .badge-pay { background: var(--green-soft); color: var(--green); }
.fab { position: fixed; bottom: 80px; right: 20px; width: 60px; height: 60px; border-radius: 30px; background: var(--primary); color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(15, 118, 110, 0.3); cursor: pointer; border: none; z-index: 90; transition: transform 0.2s; }
.fab:active { transform: scale(0.9); }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; z-index: 999; backdrop-filter: blur(2px); }
.modal { background: var(--bg); width: 100%; max-width: 600px; margin: 0 auto; border-radius: 24px 24px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.receipt-box { background: #fff; color: #000; padding: 24px; border-radius: 8px; font-family: 'Noto Sans Bengali', monospace; font-size: 14px; white-space: pre-wrap; border: 1px dashed #ccc; margin: 16px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); line-height: 1.6; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { background: var(--primary-soft); color: var(--primary); padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 14px; border: 1px solid var(--primary); cursor: pointer; }
.chip:active { background: var(--primary); color: #fff; }
.lock-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
.pin-dots { display: flex; gap: 16px; margin: 24px 0; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--border); }
.pin-dot.active { background: var(--primary); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 280px; }
.pin-btn { width: 70px; height: 70px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); font-family: 'Noto Sans Bengali', sans-serif;}
.pin-btn:active { background: var(--primary-soft); }
.sync-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--border); color: var(--muted); margin-left: 8px; }
.sync-badge.ok { background: var(--green-soft); color: var(--green); }
.sync-badge.err { background: var(--red-soft); color: var(--red); }
.quick-pay-btn { background: var(--green-soft); color: var(--green); border: 1px solid var(--green); border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; margin-top: 4px;}
.info-box { background: var(--primary-soft); color: var(--primary); padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen hide">
  <h2 style="color:var(--primary);margin-bottom:8px;">🔒 বাকির খাতা</h2>
  <p class="muted">৪ ডিজিটের পিন দিন</p>
  <div class="pin-dots"><div class="pin-dot" id="d1"></div><div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div><div class="pin-dot" id="d4"></div></div>
  <div class="pin-pad" id="pinPad"></div>
</div>

<div id="app"></div>

<div class="bottom-nav" id="bottomNav">
  <div class="nav-item" data-page="home" onclick="App.nav('home')"><div class="nav-icon">🏠</div>হোম</div>
  <div class="nav-item" data-page="customers" onclick="App.nav('customers')"><div class="nav-icon">👥</div>কাস্টমার</div>
  <div class="nav-item" data-page="report" onclick="App.nav('report')"><div class="nav-icon">📊</div>রিপোর্ট</div>
  <div class="nav-item" data-page="products" onclick="App.nav('products')"><div class="nav-icon">📦</div>পণ্য</div>
  <div class="nav-item" data-page="settings" onclick="App.nav('settings')"><div class="nav-icon">⚙️</div>সেটিংস</div>
</div>

<div id="modalRoot"></div>

<script>
/* ==================== Utilities ==================== */
const BN = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
const MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const toBn = v => String(v).replace(/\d/g, d => BN[+d]);
const fmt = n => { n = +n || 0; return toBn(n.toLocaleString('en-US', {maximumFractionDigits: 2})); };
const tk = n => fmt(n) + '৳';

function parseNum(str) {
  if (str === '' || str === null || str === undefined) return 0;
  const en = String(str).replace(/[০-৯]/g, d => String(d.charCodeAt(0) - 2534));
  const n = parseFloat(en);
  return isFinite(n) ? n : 0;
}

const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(), p = x => String(x).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()); };
const bnDate = iso => { if(!iso) return ''; const p = iso.split('-'); return toBn(+p[2]) + ' ' + MONTHS[+p[1]-1] + ' ' + toBn(+p[0]); };
const phone880 = p => { p = String(p || '').replace(/\D/g, ''); if(!p) return ''; if(p.startsWith('0')) p = '880' + p.slice(1); return p; };

/* ==================== State & Storage ==================== */
const STORE_KEY = 'baki_pro_v4';
let state;
try { state = JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e) {}
if (!state || !Array.isArray(state.customers)) {
  state = {
    shop: 'আমার দোকান', pin: '', theme: 'light',
    customers: [], transactions: [],
    products: [{ id: uid(), name: 'চাল', price: 60 }, { id: uid(), name: 'ডাল', price: 120 }, { id: uid(), name: 'তেল', price: 180 }],
    pantryId: '', syncStatus: 'off',
    telegramToken: '', telegramChatId: ''
  };
}

const saveLocal = () => localStorage.setItem(STORE_KEY, JSON.stringify(state));
const save = () => {
  saveLocal();
  if (state.pantryId) syncToPantry();
  if (state.telegramToken && state.telegramChatId) sendBackupToTelegram();
};

/* ==================== Pantry Auto Backup ==================== */
let pantryTimeout = null;

async function pushToPantry() {
  if (!state.pantryId) throw new Error('Pantry ID নেই');
  const res = await fetch(`https://getpantry.cloud/apiv1/pantry/${state.pantryId}/basket/baki-khata`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(state)
  });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const j = await res.json(); msg = j.message || j.error || msg; } catch(e){}
    throw new Error(msg);
  }
  return true;
}

async function syncToPantry() {
  if (!state.pantryId) return;
  if (pantryTimeout) clearTimeout(pantryTimeout);
  pantryTimeout = setTimeout(async () => {
    const badge = document.getElementById('syncIndicator');
    if (badge && (!state.telegramToken || !state.telegramChatId)) {
      badge.textContent = 'প্যান্ট্রি সিঙ্ক হচ্ছে...';
      badge.className = 'sync-badge';
    }
    try {
      await pushToPantry();
      state.syncStatus = 'ok';
      saveLocal();
      if (badge && (!state.telegramToken || !state.telegramChatId)) {
        badge.textContent = 'প্যান্ট্রি সিঙ্কড ✓';
        badge.className = 'sync-badge ok';
      }
    } catch (e) {
      console.error('Pantry sync failed:', e);
      state.syncStatus = 'err';
      saveLocal();
      if (badge && (!state.telegramToken || !state.telegramChatId)) {
        badge.textContent = 'প্যান্ট্রি ব্যর্থ ✕';
        badge.className = 'sync-badge err';
      }
    }
  }, 2000);
}

async function pullFromPantry() {
  if (!state.pantryId) { alert('আগে Pantry ID বসিয়ে সেভ করুন'); return; }
  try {
    const res = await fetch(`https://getpantry.cloud/apiv1/pantry/${state.pantryId}/basket/baki-khata`);
    
    if (!res.ok) {
      if (res.status === 400 || res.status === 404) {
        alert('❌ প্যান্ট্রিতে এখনো কোনো ব্যাকআপ নেই!\n\nপ্রথমে "এখনই ব্যাকআপ করুন" বাটনে চাপ দিয়ে ব্যাকআপ তৈরি করুন। তারপর রিস্টোর করুন।');
        return;
      }
      throw new Error(`HTTP ${res.status}`);
    }
    
    const cloudState = await res.json();
    const ncust = (cloudState.customers || []).length;
    const ntx = (cloudState.transactions || []).length;
    const shopName = cloudState.shop || 'অজানা';
    
    const msg = `প্যান্ট্রি ব্যাকআপে যা আছে:\n\n📦 দোকান: ${shopName}\n👥 কাস্টমার: ${ncust} জন\n📝 লেনদেন: ${ntx} টি\n\n⚠️ রিস্টোর করলে আপনার বর্তমান সব ডেটা মুছে যাবে!\n\nএগিয়ে যাবেন?`;
    
    if (!confirm(msg)) return;
    
    cloudState.pantryId = state.pantryId;
    cloudState.telegramToken = state.telegramToken;
    cloudState.telegramChatId = state.telegramChatId;
    cloudState.pin = state.pin;
    cloudState.theme = state.theme;
    cloudState.syncStatus = 'ok';
    
    state = cloudState;
    saveLocal();
    render();
    alert('✅ সফলভাবে রিস্টোর হয়েছে!');
  } catch (e) {
    alert('❌ রিস্টোর ব্যর্থ:\n' + e.message + '\n\nসম্ভাব্য কারণ:\n• ইন্টারনেট নেই\n• Pantry ID ভুল\n• এখনো ব্যাকআপ তৈরি হয়নি');
  }
}

/* ==================== Telegram Auto Backup ==================== */
let tgTimeout = null;
let isTelegramSending = false;

async function sendBackupToTelegram() {
  if (!state.telegramToken || !state.telegramChatId) return;
  if (tgTimeout) clearTimeout(tgTimeout);
  tgTimeout = setTimeout(async () => {
    if (isTelegramSending) return;
    isTelegramSending = true;
    const token = state.telegramToken;
    const chatId = state.telegramChatId;
    const badge = document.getElementById('syncIndicator');
    if (badge) { badge.textContent = 'টেলিগ্রাম সিঙ্ক হচ্ছে...'; badge.className = 'sync-badge'; }
    try {
      const dues = getAllDues();
      let totalDue = 0;
      state.customers.forEach(c => { if (dues[c.id] && dues[c.id].due > 0) totalDue += dues[c.id].due; });
      const now = new Date();
      const timeStr = toBn(String(now.getHours()).padStart(2,'0')) + ':' + toBn(String(now.getMinutes()).padStart(2,'0'));
      let summary = `📒 ${state.shop}\n📅 ${bnDate(today())} • ${timeStr}\n━━━━━━━━━━━━━━━━\n\n👥 কাস্টমার: ${toBn(state.customers.length)} জন\n💰 মোট বাকি: ${tk(totalDue)}\n📝 লেনদেন: ${toBn(state.transactions.length)} টি\n\n`;
      if (state.customers.length) {
        summary += `━━━ কাস্টমার তালিকা ━━━\n`;
        const sorted = [...state.customers].sort((a,b) => (dues[b.id]?.due || 0) - (dues[a.id]?.due || 0));
        sorted.forEach((c, i) => {
          const d = dues[c.id] ? dues[c.id].due : 0;
          const icon = d > 0 ? '🔴' : '🟢';
          summary += `${toBn(i+1)}. ${icon} ${c.name} — ${tk(d)}\n`;
          if (c.phone) summary += `   📞 ${toBn(c.phone)}\n`;
          let itemsList = [];
          state.transactions.filter(t => t.customerId === c.id && t.type === 'credit').forEach(t => {
            if (t.items && t.items.length) {
              t.items.forEach(item => {
                if (item.name && item.name.trim() && !itemsList.includes(item.name.trim())) itemsList.push(item.name.trim());
              });
            }
          });
          if (itemsList.length) summary += `   🛒 পণ্য: ${itemsList.join(', ')}\n`;
          summary += `\n`;
        });
      }
      if (summary.length > 4000) summary = summary.substring(0, 3900) + '\n\n...';
      const textRes = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: summary, disable_web_page_preview: true })
      });
      const textData = await textRes.json();
      if (!textData.ok) throw new Error("Failed text");
      const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
      const formData = new FormData();
      formData.append('chat_id', chatId);
      formData.append('document', blob, `baki_${today()}.json`);
      formData.append('caption', '💾 রিস্টোর করার ফাইল');
      const docRes = await fetch(`https://api.telegram.org/bot${token}/sendDocument`, { method: 'POST', body: formData });
      const docData = await docRes.json();
      if (!docData.ok) throw new Error("Failed doc");
      if (badge) { badge.textContent = 'টেলিগ্রাম সিঙ্কড ✓'; badge.className = 'sync-badge ok'; }
    } catch (e) {
      console.error(e);
      if (badge) { badge.textContent = 'টেলিগ্রাম ব্যর্থ ✕'; badge.className = 'sync-badge err'; }
    } finally { isTelegramSending = false; }
  }, 5000);
}

/* ==================== Router ==================== */
let currentPage = 'home';
let currentParam = null;
let draft = null;
let editingProduct = null;

function nav(page, param = null) {
  currentPage = page; currentParam = param;
  if(page === 'home') draft = null;
  render(); window.scrollTo(0, 0);
}

/* ==================== Data Calculations ==================== */
function getTotals(cid) {
  let cr = 0, pa = 0;
  for (const t of state.transactions) {
    if (t.customerId === cid) { if (t.type === 'credit') cr += t.amount; else pa += t.amount; }
  }
  return { cr, pa, due: cr - pa };
}
function getAllDues() {
  const map = {};
  state.customers.forEach(c => map[c.id] = { cr: 0, pa: 0, due: 0 });
  for (const t of state.transactions) {
    const m = map[t.customerId]; if (!m) continue;
    if (t.type === 'credit') m.cr += t.amount; else m.pa += t.amount;
  }
  for (const k in map) map[k].due = map[k].cr - map[k].pa;
  return map;
}
function getCustomerProducts(cid) {
  let itemsList = [];
  state.transactions.filter(t => t.customerId === cid && t.type === 'credit').forEach(t => {
    if (t.items && t.items.length) {
      t.items.forEach(item => {
        if (item.name && item.name.trim() && !itemsList.includes(item.name.trim())) itemsList.push(item.name.trim());
      });
    }
  });
  return itemsList;
}

/* ==================== Render Engine ==================== */
function render() {
  document.documentElement.setAttribute('data-theme', state.theme);
  const app = document.getElementById('app');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === currentPage || (currentPage === 'detail' && el.dataset.page === 'home')));

  if (currentPage === 'home') app.innerHTML = viewHome();
  else if (currentPage === 'customers') app.innerHTML = viewCustomers();
  else if (currentPage === 'report') app.innerHTML = viewReport();
  else if (currentPage === 'detail') app.innerHTML = viewDetail(currentParam);
  else if (currentPage === 'form') app.innerHTML = viewForm(currentParam);
  else if (currentPage === 'credit') app.innerHTML = viewCredit(currentParam);
  else if (currentPage === 'payment') app.innerHTML = viewPayment(currentParam);
  else if (currentPage === 'products') app.innerHTML = viewProducts();
  else if (currentPage === 'settings') app.innerHTML = viewSettings();

  if (currentPage === 'home' || currentPage === 'customers') bindHome();
  if (currentPage === 'credit') bindCredit();
}

/* ==================== Views ==================== */
function viewHome() {

  const dues = getAllDues();
  const topDues = [...state.customers].sort((a,b) => dues[b.id].due - dues[a.id].due).slice(0, 5);

function bindCredit() {
  const container = document.getElementById('linesContainer');
  container.innerHTML = '';
  if(!draft.lines.length) draft.lines.push({ name: '', qty: '', price: '' });
  draft.lines.forEach(l => container.appendChild(createLineNode(l)));
  document.getElementById('cDate').addEventListener('change', e => draft.date = e.target.value);
  document.getElementById('cNote').addEventListener('input', e => draft.note = e.target.value);
  const m = document.getElementById('mAmt');
  if(m) m.addEventListener('input', e => draft.manual = e.target.value);
  App.setMode(draft.mode);
  updateBillTotal();
}

function createLineNode(l) {
  const div = document.createElement('div');
  div.className = 'card'; div.style.padding = '12px'; div.style.marginBottom = '10px';
  div.innerHTML = `
    <div class="flex justify-between items-center mb-2">
      <input class="input" style="padding:8px;font-size:14px;flex:1;" placeholder="পণ্যের নাম (ঐচ্ছিক)" value="${esc(l.name)}" data-name>
      <button class="icon-btn" style="width:32px;height:32px;font-size:14px;margin-left:8px;border:none;background:var(--red-soft);color:var(--red);" data-del>✕</button>
    </div>
    <div class="flex" style="gap:8px;">
      <div style="flex:1;"><label style="font-size:11px;">পরিমাণ</label><input type="text" inputmode="decimal" class="input" style="padding:8px;font-size:14px;" placeholder="১" value="${esc(l.qty)}" data-qty></div>
      <div style="flex:1;"><label style="font-size:11px;">দর (৳)</label><input type="text" inputmode="decimal" class="input" style="padding:8px;font-size:14px;" placeholder="০" value="${esc(l.price)}" data-price></div>
      <div style="flex:1;text-align:right;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:8px;"><span style="font-weight:700;color:var(--primary);" data-total>০৳</span></div>
    </div>
  `;
  const nm = div.querySelector('[data-name]'), q = div.querySelector('[data-qty]'), p = div.querySelector('[data-price]'), tot = div.querySelector('[data-total]');
  const upd = () => {
    const qv = parseNum(l.qty), pv = parseNum(l.price);
    tot.textContent = tk((qv > 0 ? qv : 1) * (pv > 0 ? pv : 0));
    updateBillTotal();
  };
  nm.addEventListener('input', e => { l.name = e.target.value; });
  q.addEventListener('input', e => { l.qty = e.target.value; upd(); });
  p.addEventListener('input', e => { l.price = e.target.value; upd(); });
  div.querySelector('[data-del]').onclick = () => { if(draft.lines.length > 1) { draft.lines.splice(draft.lines.indexOf(l), 1); div.remove(); updateBillTotal(); } };
  upd(); return div;
}

function updateBillTotal() {
  const total = draft.lines.reduce((sum, l) => {
    const qv = parseNum(l.qty), pv = parseNum(l.price);
    return sum + ((qv > 0 ? qv : 1) * (pv > 0 ? pv : 0));
  }, 0);
  const el = document.getElementById('billTotal'); if(el) el.textContent = tk(total);
}

/* ==================== App Logic ==================== */
const App = {};
App.nav = nav;
App.toggleTheme = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); render(); };

App.saveCustomer = (id) => {
  const name = document.getElementById('fName').value.trim(), phone = document.getElementById('fPhone').value.trim(), addr = document.getElementById('fAddr').value.trim();
  if (!name) { document.getElementById('formErr').textContent = 'নাম অবশ্যই দিতে হবে'; return; }
  if (id) { const c = state.customers.find(x => x.id === id); c.name = name; c.phone = phone; c.address = addr; }
  else { state.customers.push({ id: uid(), name, phone, address: addr, createdAt: Date.now() }); }
  save(); App.nav('customers');
};

App.deleteCustomer = (id) => {
  if (!confirm('আপনি কি নিশ্চিত? এই কাস্টমারের সব লেনদেন মুছে যাবে!')) return;
  state.customers = state.customers.filter(c => c.id !== id); state.transactions = state.transactions.filter(t => t.customerId !== id);
  save(); App.nav('customers');
};

App.setMode = (m) => {
  draft.mode = m;
  document.getElementById('areaP').classList.toggle('hide', m !== 'product');
  document.getElementById('areaM').classList.toggle('hide', m !== 'manual');
  const btnP = document.getElementById('tabProd'), btnM = document.getElementById('tabMan');
  btnP.style.background = m === 'product' ? 'var(--primary)' : 'transparent'; btnP.style.color = m === 'product' ? '#fff' : 'var(--muted)';
  btnM.style.background = m === 'manual' ? 'var(--primary)' : 'transparent'; btnM.style.color = m === 'manual' ? '#fff' : 'var(--muted)';
};

App.addLine = () => { const l = { name: '', qty: '', price: '' }; draft.lines.push(l); document.getElementById('linesContainer').appendChild(createLineNode(l)); };
App.quickAdd = (pid) => {
  const p = state.products.find(x => x.id === pid); if (!p) return;
  if (draft.lines.length === 1 && !draft.lines[0].name && !draft.lines[0].price) { draft.lines = []; document.getElementById('linesContainer').innerHTML = ''; }
  const l = { name: p.name, qty: '1', price: String(p.price) }; draft.lines.push(l); document.getElementById('linesContainer').appendChild(createLineNode(l)); updateBillTotal();
};

App.saveCredit = () => {
  const err = document.getElementById('creditErr'); let amount = 0, items = [];
  if (draft.mode === 'product') {
    const validLines = draft.lines.filter(l => (l.name || '').trim() || parseNum(l.price) > 0);
    if (!validLines.length) { err.textContent = 'অন্তত একটি পণ্যের নাম বা দর দিন'; return; }
    items = validLines.map(l => {
      const qv = parseNum(l.qty), pv = parseNum(l.price);
      return { name: (l.name || '').trim(), qty: qv > 0 ? qv : 1, price: pv };
    });
    amount = items.reduce((s, i) => s + (i.qty * i.price), 0);
    if (amount <= 0) { err.textContent = 'মোট বিল ০ এর বেশি হতে হবে'; return; }
  } else {
    amount = parseNum(document.getElementById('mAmt').value);
    if (!(amount > 0)) { err.textContent = 'সঠিক পরিমাণ লিখুন'; return; }
  }
  state.transactions.push({ id: uid(), customerId: draft.custId, type: 'credit', amount, date: draft.date, note: draft.note, items, createdAt: Date.now() });
  save(); const cid = draft.custId; draft = null; App.nav('detail', cid);
};

App.savePayment = (cid) => {
  const err = document.getElementById('payErr'); const amount = parseNum(document.getElementById('pAmt').value);
  if (!(amount > 0)) { err.textContent = 'সঠিক পরিমাণ লিখুন'; return; }
  state.transactions.push({ id: uid(), customerId: cid, type: 'payment', amount, date: document.getElementById('pDate').value || today(), note: document.getElementById('pNote').value.trim(), items: [], createdAt: Date.now() });
  save(); App.nav('detail', cid);
};

App.delTx = (id) => { if (!confirm('লেনদেনটি মুছে ফেলবেন?')) return; state.transactions = state.transactions.filter(t => t.id !== id); save(); render(); };

App.saveProduct = () => {
  const name = document.getElementById('prName').value.trim(), price = parseNum(document.getElementById('prPrice').value);
  if (!name || !(price > 0)) { document.getElementById('prErr').textContent = 'নাম ও সঠিক দর দিন'; return; }
  if (editingProduct) { const p = state.products.find(x => x.id === editingProduct); p.name = name; p.price = price; editingProduct = null; }
  else { state.products.push({ id: uid(), name, price }); }
  save(); render();
};

App.editProd = (id) => { editingProduct = id; render(); };
App.cancelEditProd = () => { editingProduct = null; render(); };
App.deleteProduct = (id) => { if (!confirm('পণ্যটি মুছবেন?')) return; state.products = state.products.filter(p => p.id !== id); if (editingProduct === id) editingProduct = null; save(); render(); };
App.saveShop = () => { const n = document.getElementById('shopNameInp').value.trim(); if (n) { state.shop = n; save(); alert('দোকানের নাম সেভ হয়েছে'); } };

App.savePantrySettings = () => {
  const newId = document.getElementById('pantryIdInp').value.trim();
  state.pantryId = newId;
  state.syncStatus = 'off';
  saveLocal();
  alert('✅ Pantry ID সেভ হয়েছে!\n\nএখন "⬆️ এখনই ব্যাকআপ করুন" বাটনে চাপ দিন।');
  render();
};

App.backupNow = async () => {
  if (!state.pantryId) { alert('আগে Pantry ID বসিয়ে "প্যান্ট্রি সেভ করুন" চাপুন'); return; }
  if (pantryTimeout) { clearTimeout(pantryTimeout); pantryTimeout = null; }
  const badge = document.getElementById('syncIndicator');
  if (badge) { badge.textContent = 'পাঠানো হচ্ছে...'; badge.className = 'sync-badge'; }
  try {
    await pushToPantry();
    state.syncStatus = 'ok';
    saveLocal();
    alert(`✅ সফলভাবে ব্যাকআপ হয়েছে!\n\n👥 কাস্টমার: ${state.customers.length} জন\n📝 লেনদেন: ${state.transactions.length} টি`);
  } catch (e) {
    state.syncStatus = 'err';
    saveLocal();
    alert('❌ ব্যাকআপ ব্যর্থ:\n' + e.message + '\n\n• ইন্টারনেট চেক করুন\n• Pantry ID ঠিক আছে কিনা দেখুন');
  }
  render();
};

App.saveTelegramSettings = () => {
  state.telegramToken = document.getElementById('tgToken').value.trim();
  state.telegramChatId = document.getElementById('tgChatId').value.trim();
  save();
  alert('টেলিগ্রাম সেটিংস সেভ হয়েছে!');
  if(state.telegramToken && state.telegramChatId) sendBackupToTelegram();
  render();
};

App.togglePin = () => {
  if (state.pin) { if (confirm('পিন লক বন্ধ করবেন?')) { state.pin = ''; save(); render(); } }
  else { const p = prompt('নতুন ৪ ডিজিটের পিন দিন:'); if (p && /^\d{4}$/.test(p)) { state.pin = p; save(); render(); } else if (p) alert('৪ ডিজিটের সংখ্যা দিন'); }
};

App.exportCSV = () => {
  let csv = '\uFEFFকাস্টমার,ফোন,মোট বাকি,মোট পরিশোধ,বর্তমান বাকি\n';
  const dues = getAllDues();
  state.customers.forEach(c => { const d = dues[c.id]; csv += `"${c.name}","${c.phone || ''}",${d.cr},${d.pa},${d.due}\n`; });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `BakiKhata_${today()}.csv`; a.click();
};

/* ==================== Quick Payment ==================== */
App.quickPay = (cid) => {

  const due = getTotals(cid).due;

    <div class="form-group"><label>নোট (ঐচ্ছিক)</label><input type="text" id="qpNote" class="input" placeholder="যেমন: নগদ"></div>

App.saveQuickPay = (cid) => {
  const amount = parseNum(document.getElementById('qpAmt').value);
  if (!(amount > 0)) { alert('সঠিক পরিমাণ লিখুন'); return; }

/* ==================== Receipts & Modals ==================== */
App.showReceipt = (txId) => {
  const tx = state.transactions.find(t => t.id === txId), c = state.customers.find(x => x.id === tx.customerId);
  let prevDue = 0; const list = state.transactions.filter(t => t.customerId === c.id).sort((a,b) => new Date(a.date) - new Date(b.date) || a.createdAt - b.createdAt);
  for (const t of list) { if (t.id === tx.id) break; prevDue += (t.type === 'credit' ? t.amount : -t.amount); }
  let text = `📒 ${state.shop}\nতারিখ: ${bnDate(tx.date)}\nকাস্টমার: ${c.name}\n--------------------\n`;
  if (tx.items && tx.items.length) { tx.items.forEach(i => { text += `${i.name || 'পণ্য'} ${toBn(i.qty)} x ${tk(i.price)} = ${tk(i.qty*i.price)}\n`; }); text += `--------------------\n`; }
  text += `আজকের বাকি: ${tk(tx.amount)}\nআগের বাকি: ${tk(prevDue)}\nমোট বাকি: ${tk(prevDue + tx.amount)}\n\nধন্যবাদ!`;
  showModal(`
    <div class="flex justify-between items-center mb-2"><h2 style="font-size:18px;">🧾 রিসিট</h2><button class="icon-btn" style="border:none;" onclick="App.closeModal()">✕</button></div>

    <div class="flex" style="gap:8px;margin-bottom:8px;">
      <button class="btn btn-outline" style="flex:1;" onclick="App.copy('${btoa(unescape(encodeURIComponent(text)))}')">কপি</button>
      <button class="btn btn-primary" style="flex:1;" onclick="window.print()">প্রিন্ট / PDF</button>
    </div>
    <div class="flex" style="gap:8px;">
      <a class="btn btn-outline" style="flex:1;text-decoration:none;background:#25D366;color:#fff;border:none;" href="https://wa.me/${phone880(c.phone)}?text=${encodeURIComponent(text)}" target="_blank">WhatsApp</a>
      <a class="btn btn-outline" style="flex:1;text-decoration:none;background:#2563eb;color:#fff;border:none;" href="sms:${c.phone}?body=${encodeURIComponent(text)}">SMS</a>
    </div>
  `);
};

App.showReminder = (cid) => {
  const c = state.customers.find(x => x.id === cid);
  const t = getTotals(cid);

  let text = `📒 ${state.shop}\n📅 তারিখ: ${bnDate(today())}\n👤 কাস্টমার: ${c.name}\n--------------------\n✅ মোট বাকি: ${tk(t.cr)}\n💵 মোট পরিশোধ: ${tk(t.pa)}\n🔴 বর্তমান বাকি: ${tk(t.due)}\n`;
  if (itemsList.length) { text += `--------------------\n🛒 পণ্যের তালিকা:\n- ${itemsList.join('\n- ')}\n`; }
  text += `--------------------\nঅনুগ্রহ করে বাকি টাকা পরিশোধ করুন।\nধন্যবাদ!`;
  showModal(`
    <div class="flex justify-between items-center mb-2"><h2 style="font-size:18px;">📄 বাকির বিবরণ / রিসিট</h2><button class="icon-btn" style="border:none;" onclick="App.closeModal()">✕</button></div>
    <div class="receipt-box" style="font-family:'Noto Sans Bengali',sans-serif; font-size:14px;">${esc(text)}</div>
    <div class="flex" style="gap:8px;margin-bottom:8px;">
      <button class="btn btn-outline" style="flex:1;" onclick="App.copy('${btoa(unescape(encodeURIComponent(text)))}')">কপি</button>

      <a class="btn btn-outline" style="flex:1;text-decoration:none;background:#2563eb;color:#fff;border:none;" href="sms:${c.phone}?body=${encodeURIComponent(text)}">SMS</a>

function showModal(html) { document.getElementById('modalRoot').innerHTML = `<div class="modal-back" onclick="if(event.target===this)App.closeModal()"><div class="modal">${html}</div></div>`; }
App.closeModal = () => { document.getElementById('modalRoot').innerHTML = ''; };
App.copy = (b64) => { const text = decodeURIComponent(escape(atob(b64))); navigator.clipboard.writeText(text).then(() => alert('কপি হয়েছে!')).catch(() => alert('কপি করা যায়নি')); };

App.showBackupModal = () => {

};

App.restore = () => {
  const val = document.getElementById('restoreArea').value;
  if (!val) return; if (!confirm('সতর্কতা: বর্তমান সব ডেটা মুছে যাবে! আপনি কি নিশ্চিত?')) return;
  try { const obj = JSON.parse(val); if (obj.customers && obj.transactions) { state = obj; save(); App.closeModal(); App.nav('home'); alert('সফলভাবে রিস্টোর হয়েছে!'); } else alert('সঠিক ব্যাকআপ ফাইল নয়'); } catch (e) { alert('ভুল ফরম্যাট!'); }
};

/* ==================== PIN Lock ==================== */
let pinEntry = '';
function initPinPad() { document.getElementById('pinPad').innerHTML = ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k => k ? `<button class="pin-btn" onclick="App.pinPress('${k}')">${k}</button>` : '<div></div>').join(''); }
App.pinPress = (k) => {
  if (k === '⌫') pinEntry = pinEntry.slice(0, -1);
  else if (pinEntry.length < 4) pinEntry += k;
  updateDots();
  if (pinEntry.length === 4) {
    setTimeout(() => {
      if (pinEntry === state.pin) { document.getElementById('lockScreen').classList.add('hide'); pinEntry = ''; }
      else { alert('ভুল পিন!'); pinEntry = ''; }
      updateDots();
    }, 200);
  }
};
function updateDots() { for (let i = 1; i <= 4; i++) document.getElementById('d' + i).classList.toggle('active', i <= pinEntry.length); }

/* ==================== Boot ==================== */
initPinPad();
if (state.pin) document.getElementById('lockScreen').classList.remove('hide');
render();
</script>
</body>
</html>

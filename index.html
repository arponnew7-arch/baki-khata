<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<title>বাকির খাতা</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f3;--card:#fff;--text:#10241a;--muted:#5c7a6b;--border:#dbe6df;--primary:#1f7a4d;--soft:#e3f2ea;--red:#d92d20;--green:#12805c}
[data-theme=dark]{--bg:#0e1512;--card:#17211d;--text:#e6f1ea;--muted:#8fae9e;--border:#26362e;--primary:#2f9e68;--soft:#163023;--red:#ff6b5e;--green:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans Bengali',system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;font-size:15px;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:12px 12px 100px}
.small{font-size:13px}.muted{color:var(--muted)}
.red{color:var(--red)!important}.green{color:var(--green)!important}.mt{margin-top:8px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-top:6px}
.brand{flex:1;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{width:44px;height:44px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.icon.danger{color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.val{font-size:22px;font-weight:700;margin-top:2px;word-break:break-all}
.val2{font-size:17px;font-weight:700;margin-top:2px;word-break:break-all}
.tots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:16px;outline:none}
.input:focus{border-color:var(--primary)}
textarea.input{resize:vertical}
.fld{display:block;margin-bottom:12px;font-size:13px;color:var(--muted)}
.fld>.input{margin-top:6px;color:var(--text)}
.err{color:var(--red);font-size:14px;margin-top:4px;min-height:0}
.btn{border:none;border-radius:12px;padding:13px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;min-height:48px;width:100%;display:block}
.btn:active{filter:brightness(.93)}
.btn.primary{background:var(--primary);color:#fff}
.btn.danger{background:var(--soft);color:var(--red);border:1px solid var(--red)}
.btn.ghost{background:transparent;color:var(--primary);border:1px dashed var(--primary)}
.btn.credit{background:var(--soft);color:var(--red);border:1px solid var(--red)}
.btn.wa{background:#25D366;color:#fff}
.btn.sms{background:#2563eb;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer}
.row:active{background:var(--soft)}
.ava{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14px}
.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;border:none;border-radius:28px;padding:14px 26px;font-size:16px;font-weight:700;font-family:inherit;box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer;z-index:20;min-height:52px;white-space:nowrap}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg-btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;min-height:46px}
.seg-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--primary);background:var(--soft);color:var(--primary);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:42px}
.line{border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--bg)}
.line-h{display:flex;gap:8px;margin-bottom:8px}
.line-h .nm{flex:1}
.line-b{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.mini{display:flex;flex-direction:column;gap:4px;min-width:0}
.mini>span{font-size:12px;color:var(--muted)}
.ltot{font-weight:700;padding-bottom:13px;white-space:nowrap;color:var(--primary);font-size:15px}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);font-size:16px}
.total strong{font-size:20px;color:var(--primary)}
.tx{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.txh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.badge.credit{background:var(--soft);color:var(--red)}
.badge.pay{background:var(--soft);color:var(--green)}
.txa{font-weight:700;font-size:17px;white-space:nowrap}
.items{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.items li{margin-bottom:2px}
.txa2{display:flex;gap:8px;margin-top:10px}
.txa2 .btn{flex:1;min-height:42px;padding:8px;font-size:14px}
.mono{font-family:ui-monospace,monospace;font-size:12px}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.md{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px;max-height:92vh;overflow:auto}
.rcpt{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;font-family:'Noto Sans Bengali',monospace;font-size:14px;white-space:pre-wrap;word-break:break-word;margin:12px 0;max-height:38vh;overflow:auto}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:.92}
.hint{background:var(--soft);color:var(--primary);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast"></div>

<script>
const BN=['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
const MON=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const bn=v=>String(v).replace(/\d/g,d=>BN[+d]);
const num=n=>{n=+n||0;const s=Math.round(n*100)/100;const[a,b]=String(s).split('.');return a.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(b?'.'+b:'');};
const tk=n=>bn(num(n))+'৳';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date(),p=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const bdate=iso=>{if(!iso)return'';const p=iso.split('-');return bn(+p[2])+' '+MON[+p[1]-1]+' '+bn(+p[0]);};
const phone880=p=>{p=String(p||'').replace(/\D/g,'');if(!p)return'';if(p.startsWith('0'))p='880'+p.slice(1);return p;};

const KEY='baki_v2';
let state;
try{ state=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
if(!state || !Array.isArray(state.customers)){
  state={shop:'আমার দোকান',theme:'light',customers:[],trans:[],products:[
    {id:uid(),name:'চাল',price:60},
    {id:uid(),name:'ডাল',price:120},
    {id:uid(),name:'তেল',price:180}
  ]};
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};

let stack=[{name:'home',params:{}}];
const page=()=>stack[stack.length-1];
const go=(n,p)=>{stack.push({name:n,params:p||{}});render();window.scrollTo(0,0);};
const back=()=>{if(stack.length>1)stack.pop();render();window.scrollTo(0,0);};
const home=()=>{stack=[{name:'home',params:{}}];render();window.scrollTo(0,0);};

function totals(cid){
  let cr=0,pa=0;
  for(const t of state.trans) if(t.customerId===cid){
    if(t.type==='credit') cr+=t.amount; else pa+=t.amount;
  }
  return {cr,pa,due:cr-pa};
}
function allDues(){
  const m={}; state.customers.forEach(c=>m[c.id]={cr:0,pa:0,due:0});
  for(const t of state.trans){
    const x=m[t.customerId]; if(!x)continue;
    if(t.type==='credit')x.cr+=t.amount; else x.pa+=t.amount;
  }
  for(const k in m) m[k].due=m[k].cr-m[k].pa;
  return m;
}

let tmr;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tmr);tmr=setTimeout(()=>t.classList.remove('show'),1800);}
async function copy(text,ok){
  try{await navigator.clipboard.writeText(text);toast(ok||'কপি হয়েছে');}
  catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast(ok||'কপি হয়েছে');}catch(_){toast('কপি হয়নি');}
    ta.remove();
  }
}

function render(){
  document.documentElement.dataset.theme = state.theme||'light';
  const p=page(), app=document.getElementById('app');
  if(p.name==='home') app.innerHTML=homeHTML();
  else if(p.name==='custForm') app.innerHTML=custFormHTML(p.params.id);
  else if(p.name==='detail') app.innerHTML=detailHTML(p.params.id);
  else if(p.name==='credit') app.innerHTML=creditHTML(p.params.id);
  else if(p.name==='payment') app.innerHTML=paymentHTML(p.params.id);
  else if(p.name==='products') app.innerHTML=productsHTML();
  else if(p.name==='settings') app.innerHTML=settingsHTML();
  else if(p.name==='backup') app.innerHTML=backupHTML();
  if(p.name==='home') afterHome();
  if(p.name==='credit') afterCredit();
}

let q='';
function homeHTML(){
  const dues=allDues();
  let total=0; state.customers.forEach(c=>{const d=dues[c.id].due; if(d>0)total+=d;});
  return `
    <div class="top">
      <div class="brand">📒 বাকির খাতা</div>
      <button class="icon" onclick="App.go('products')" title="পণ্য">📦</button>
      <button class="icon" onclick="App.go('settings')" title="সেটিংস">⚙️</button>
    </div>
    <div class="stats">
      <div class="card"><div class="muted small">মোট বাকি</div><div class="val ${total>0?'red':'green'}">${tk(total)}</div></div>
      <div class="card"><div class="muted small">কাস্টমার</div><div class="val">${bn(state.customers.length)} জন</div></div>
    </div>
    <input id="q" class="input" placeholder="🔍 নাম বা ফোন" value="${esc(q)}">
    <div id="list" class="mt"></div>
    <button class="fab" onclick="App.go('custForm')">+ নতুন কাস্টমার</button>
  `;
}
function afterHome(){
  document.getElementById('q').addEventListener('input',e=>{q=e.target.value;paintList();});
  paintList();
}
function paintList(){
  const dues=allDues(), s=q.trim().toLowerCase();
  let rows=state.customers.filter(c=>!s||c.name.toLowerCase().includes(s)||String(c.phone||'').includes(s));
  rows=rows.map(c=>({c,d:dues[c.id].due})).sort((a,b)=>b.d-a.d);
  const el=document.getElementById('list');
  if(!rows.length){el.innerHTML=`<div class="empty">${s?'কিছু পাওয়া যায়নি':'এখনো কোনো কাস্টমার নেই'}</div>`;return;}
  el.innerHTML=rows.map(({c,d})=>`
    <div class="row" onclick="App.go('detail',{id:'${c.id}'})">
      <div class="ava">${esc(c.name.charAt(0)||'?')}</div>
      <div class="grow">
        <div class="name">${esc(c.name)}</div>
        ${c.phone?`<div class="sub">📞 ${bn(esc(c.phone))}</div>`:''}
      </div>
      <div class="amt ${d>0?'red':'green'}">${tk(d)}</div>
    </div>`).join('');
}

function custFormHTML(id){
  const c = id ? state.customers.find(x=>x.id===id) : null;
  return `
    <div class="top">
      <button class="icon" onclick="App.back()">←</button>
      <div class="brand">${c?'কাস্টমার সম্পাদনা':'নতুন কাস্টমার'}</div>
      <div style="width:44px"></div>
    </div>
    <div class="card">
      <label class="fld">নাম *<input id="fName" class="input" value="${esc(c?c.name:'')}"></label>
      <label class="fld">ফোন<input id="fPhone" class="input" type="tel" value="${esc(c?c.phone:'')}"></label>
      <label class="fld">ঠিকানা<textarea id="fAddr" class="input" rows="2">${esc(c?c.address:'')}</textarea></label>
      <div id="err" class="err"></div>
      <button class="btn primary mt" onclick="App.saveCust('${id||''}')">সংরক্ষণ</button>
      ${c?`<button class="btn danger mt" onclick="App.delCust('${c.id}')">মুছুন</button>`:''}
    </div>
  `;
}

function detailHTML(id){
  const c=state.customers.find(x=>x.id===id);
  if(!c) return `<div class="card">কাস্টমার পাওয়া যায়নি<button class="btn primary mt" onclick="App.home()">হোম</button></div>`;
  const t=totals(id);
  const list=state.trans.filter(x=>x.customerId===id)
    .sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.createdAt-a.createdAt);
  return `
    <div class="top">
      <button class="icon" onclick="App.back()">←</button>
      <div class="brand">${esc(c.name)}</div>
      <button class="icon" onclick="App.go('custForm',{id:'${c.id}'})">✏️</button>
    </div>
    <div class="card">
      ${c.phone?`<div class="sub">📞 ${bn(esc(c.phone))}</div>`:''}
      ${c.address?`<div class="sub">📍 ${esc(c.address)}</div>`:''}
      <div class="tots">
        <div><div class="muted small">মোট বাকি</div><div class="val2">${tk(t.cr)}</div></div>
        <div><div class="muted small">পরিশোধ</div><div class="val2">${tk(t.pa)}</div></div>
        <div><div class="muted small">বর্তমান</div><div class="val2 ${t.due>0?'red':'green'}">${tk(t.due)}</div></div>
      </div>
    </div>
    <div class="two">
      <button class="btn credit" onclick="App.go('credit',{id:'${c.id}'})">+ বাকি দিলাম</button>
      <button class="btn primary" onclick="App.go('payment',{id:'${c.id}'})">+ টাকা পেলাম</button>
    </div>
    <button class="btn ghost" onclick="App.reminder('${c.id}')">🔔 বাকির রিমাইন্ডার</button>
    <div class="muted small mt" style="font-weight:700">লেনদেন</div>
    <div class="mt">${list.length ? list.map(txHTML).join('') : '<div class="empty">কোনো লেনদেন নেই</div>'}</div>
  `;
}
function itemText(i){
  const nm = i.name && i.name.trim() ? i.name : 'পণ্য';
  return `${esc(nm)} ${bn(i.qty)} × ${tk(i.price)} = ${tk(i.qty*i.price)}`;
}
function txHTML(t){
  const isC=t.type==='credit';
  return `
    <div class="tx">
      <div class="txh">
        <span class="badge ${isC?'credit':'pay'}">${isC?'বাকি':'পরিশোধ'}</span>
        <span class="txa ${isC?'red':'green'}">${isC?'':'-'}${tk(t.amount)}</span>
      </div>
      <div class="sub">${bdate(t.date)}</div>
      ${t.items&&t.items.length?`<ul class="items">${t.items.map(i=>`<li>${itemText(i)}</li>`).join('')}</ul>`:''}
      ${t.note?`<div class="sub">📝 ${esc(t.note)}</div>`:''}
      <div class="txa2">
        ${isC?`<button class="btn ghost" onclick="App.receipt('${t.id}')">🧾 রিসিট</button>`:''}
        <button class="btn danger" onclick="App.delTx('${t.id}')">মুছুন</button>
      </div>
    </div>
  `;
}

let draft=null;
function creditHTML(cid){
  const c=state.customers.find(x=>x.id===cid);
  if(!c) return `<div class="card">কাস্টমার পাওয়া যায়নি</div>`;
  if(!draft || draft.custId!==cid){
    draft={custId:cid,mode:'product',lines:[{name:'',qty:'',price:''}],date:today(),note:'',manual:''};
  }
  return `
    <div class="top">
      <button class="icon" onclick="App.back()">←</button>
      <div class="brand">বাকি দিলাম</div>
      <div style="width:44px"></div>
    </div>
    <div class="card small muted">${esc(c.name)} · বর্তমান ${tk(totals(cid).due)}</div>
    <div class="seg">
      <button id="segP" class="seg-btn" onclick="App.setMode('product')">পণ্যের বিল</button>
      <button id="segM" class="seg-btn" onclick="App.setMode('manual')">সরাসরি টাকা</button>
    </div>
    <div id="areaP">
      <div class="hint">💡 সব ঘর ঐচ্ছিক — যা জানা আছে লিখুন। <b>শুধু দর লিখলেও হবে</b> (পরিমাণ খালি = ১ ধরা হবে)।</div>
      <div class="card">
        <div class="muted small" style="font-weight:700;margin-bottom:8px">দ্রুত যোগ</div>
        <div id="chips" class="chips"></div>
      </div>
      <div class="card">
        <div id="lines"></div>
        <button class="btn ghost mt" onclick="App.addLine()">+ নতুন লাইন</button>
        <div class="total"><span>মোট বিল</span><strong id="billTotal">০৳</strong></div>
      </div>
    </div>
    <div id="areaM" style="display:none">
      <div class="hint">💡 শুধু টাকার পরিমাণ লিখে সেভ করুন — তাড়াহুড়োয় সবচেয়ে সহজ।</div>
      <div class="card">
        <label class="fld">টাকার পরিমাণ *<input id="mAmt" class="input" type="number" inputmode="decimal" value="${esc(draft.manual)}"></label>
      </div>
    </div>
    <div class="card">
      <label class="fld">তারিখ<input id="cDate" class="input" type="date" value="${draft.date}"></label>
      <label class="fld">নোট<input id="cNote" class="input" value="${esc(draft.note)}"></label>
      <div id="err" class="err"></div>
      <button class="btn primary mt" onclick="App.saveCredit()">সংরক্ষণ</button>
    </div>
  `;
}
function afterCredit(){
  const chips=document.getElementById('chips');
  if(chips){
    chips.innerHTML = state.products.length
      ? state.products.map(p=>`<button class="chip" onclick="App.quickAdd('${p.id}')">${esc(p.name)} · ${tk(p.price)}</button>`).join('')
      : '<span class="muted small">পণ্য যোগ করুন 📦 থেকে</span>';
  }
  const linesEl=document.getElementById('lines');
  linesEl.innerHTML='';
  if(!draft.lines.length) draft.lines.push({name:'',qty:'',price:''});
  draft.lines.forEach(l=>linesEl.appendChild(lineNode(l)));

  document.getElementById('cDate').addEventListener('change',e=>{draft.date=e.target.value||today();});
  document.getElementById('cNote').addEventListener('input',e=>{draft.note=e.target.value;});
  const m=document.getElementById('mAmt');
  if(m) m.addEventListener('input',e=>{draft.manual=e.target.value;});

  App.setMode(draft.mode||'product');
  updateTotal();
}
function effQty(l){ return (+l.qty > 0) ? +l.qty : 1; }
function effPrice(l){ return (+l.price > 0) ? +l.price : 0; }
function hasContent(l){ return !!(l.name||'').trim() || +l.qty > 0 || +l.price > 0; }
function lineNode(l){
  const div=document.createElement('div');
  div.className='line';
  div.innerHTML=`
    <div class="line-h">
      <input class="input nm" placeholder="পণ্যের নাম (ঐচ্ছিক)" value="${esc(l.name)}">
      <button class="icon danger" data-x>✕</button>
    </div>
    <div class="line-b">
      <label class="mini"><span>পরিমাণ</span><input class="input qty" type="number" inputmode="decimal" placeholder="১" value="${l.qty!==''?esc(l.qty):''}"></label>
      <label class="mini"><span>দর (৳)</span><input class="input pr" type="number" inputmode="decimal" placeholder="০" value="${l.price!==''?esc(l.price):''}"></label>
      <div class="ltot"></div>
    </div>`;
  const nm=div.querySelector('.nm'), qEl=div.querySelector('.qty'), pEl=div.querySelector('.pr'), lt=div.querySelector('.ltot');
  const upd=()=>{ lt.textContent = hasContent(l) ? tk(effQty(l)*effPrice(l)) : '—'; updateTotal(); };
  nm.addEventListener('input',()=>{l.name=nm.value; upd();});
  qEl.addEventListener('input',()=>{l.qty=qEl.value===''?'':(parseFloat(qEl.value)||0);upd();});
  pEl.addEventListener('input',()=>{l.price=pEl.value===''?'':(parseFloat(pEl.value)||0);upd();});
  div.querySelector('[data-x]').onclick=()=>{const i=draft.lines.indexOf(l);if(i>=0)draft.lines.splice(i,1);div.remove();updateTotal();};
  upd();
  return div;
}
function updateTotal(){
  if(!draft) return;
  const s=draft.lines.reduce((a,l)=>a + (hasContent(l) ? effQty(l)*effPrice(l) : 0), 0);
  const el=document.getElementById('billTotal');
  if(el) el.textContent=tk(s);
}

  return `

}

  return `
    <div class="top">
      <button class="icon" onclick="App.back()">←</button>
      <div class="brand">সেটিংস</div>
      <div style="width:44px"></div>
    </div>
    <div class="card">
      <label class="fld">দোকানের নাম (রিসিটে)<input id="shop" class="input" value="${esc(state.shop)}"></label>

    </div>

function backupHTML(){
  return `
    <div class="top">
      <button class="icon" onclick="App.back()">←</button>
      <div class="brand">ব্যাকআপ</div>
      <div style="width:44px"></div>
    </div>
    <div class="card">
      <div class="muted small" style="font-weight:700;margin-bottom:8px">আপনার ডেটা</div>
      <textarea class="input mono" id="out" rows="8" readonly>${esc(JSON.stringify(state,null,2))}</textarea>
      <button class="btn primary mt" onclick="App.copyBackup()">কপি</button>
    </div>
    <div class="card">
      <div class="muted small" style="font-weight:700;margin-bottom:8px">রিস্টোর</div>
      <textarea class="input mono" id="in" rows="6" placeholder="JSON পেস্ট করুন"></textarea>
      <div id="err" class="err"></div>
      <button class="btn danger mt" onclick="App.restore()">রিস্টোর</button>
    </div>
  `;
}

let receiptText='', receiptPhone='';
function dueBeforeTx(tx){
  const list=state.trans.filter(t=>t.customerId===tx.customerId)
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.createdAt-b.createdAt);
  let due=0;
  for(const t of list){ if(t.id===tx.id) break; due+=t.type==='credit'?t.amount:-t.amount; }
  return due;
}
function buildCreditReceipt(tx){
  const c=state.customers.find(x=>x.id===tx.customerId);
  const prev=dueBeforeTx(tx);
  const out=['📒 '+(state.shop||'আমার দোকান'),'তারিখ: '+bdate(tx.date),'কাস্টমার: '+(c?c.name:'')];
  if(tx.items&&tx.items.length){
    out.push('');
    tx.items.forEach(i=>{
      const nm=i.name&&i.name.trim()?i.name:'পণ্য';
      out.push(`${nm} ${bn(i.qty)} × ${bn(i.price)} = ${tk(i.qty*i.price)}`);
    });
  }
  out.push('আজকের বাকি: '+tk(tx.amount));
  out.push('আগের বাকি: '+tk(prev));
  out.push('মোট বাকি: '+tk(prev+tx.amount));
  out.push(''); out.push('ধন্যবাদ।');
  return out.join('\n');
}
function buildReminder(c){
  const t=totals(c.id);
  return ['📒 '+(state.shop||'আমার দোকান'),'তারিখ: '+bdate(today()),'কাস্টমার: '+c.name,'','বর্তমান বাকি: '+tk(t.due),'অনুগ্রহ করে পরিশোধ করুন।','ধন্যবাদ।'].join('\n');
}
function showReceipt(text,phone){
  receiptText=text; receiptPhone=phone||'';
  document.getElementById('modal').innerHTML=`
    <div class="mb" onclick="if(event.target===this)App.closeModal()">
      <div class="md">
        <div style="font-weight:700;margin-bottom:4px">🧾 রিসিট</div>
        <pre class="rcpt">${esc(text)}</pre>
        <button class="btn primary" onclick="App.copyReceipt()">কপি করুন</button>
        <button class="btn wa mt" onclick="App.sendWA()">WhatsApp-এ পাঠান</button>
        <button class="btn sms mt" onclick="App.sendSMS()">SMS-এ পাঠান</button>
        <button class="btn ghost mt" onclick="App.closeModal()">বন্ধ</button>
      </div>
    </div>`;
}

const App={go,back,home};

App.saveCust=id=>{
  const name=document.getElementById('fName').value.trim();
  const phone=document.getElementById('fPhone').value.trim();
  const addr=document.getElementById('fAddr').value.trim();
  const err=document.getElementById('err'); err.textContent='';
  if(!name){err.textContent='নাম দিন';return;}
  if(phone && !/^[0-9+\-\s]{6,20}$/.test(phone)){err.textContent='সঠিক ফোন দিন';return;}
  let c;
  if(id){ c=state.customers.find(x=>x.id===id); if(!c){err.textContent='পাওয়া যায়নি';return;} c.name=name;c.phone=phone;c.address=addr; }
  else { c={id:uid(),name,phone,address:addr,createdAt:Date.now()}; state.customers.push(c); }
  save(); home(); go('detail',{id:c.id});
};
App.delCust=id=>{
  const c=state.customers.find(x=>x.id===id); if(!c)return;
  if(!confirm(`"${c.name}" মুছে ফেলবেন?\nতার সব লেনদেনও মুছে যাবে।`))return;
  state.customers=state.customers.filter(x=>x.id!==id);
  state.trans=state.trans.filter(t=>t.customerId!==id);
  save(); home();
};

App.setMode=m=>{
  if(!draft)return;
  draft.mode=m;
  document.getElementById('areaP').style.display=m==='product'?'':'none';
  document.getElementById('areaM').style.display=m==='manual'?'':'none';
  document.getElementById('segP').classList.toggle('active',m==='product');
  document.getElementById('segM').classList.toggle('active',m==='manual');
};
App.addLine=()=>{
  if(!draft)return;
  const l={name:'',qty:'',price:''};
  draft.lines.push(l);
  document.getElementById('lines').appendChild(lineNode(l));
};
App.quickAdd=pid=>{
  const p=state.products.find(x=>x.id===pid); if(!p||!draft)return;
  if(draft.lines.length===1 && !hasContent(draft.lines[0])){
    draft.lines.length=0;
    document.getElementById('lines').innerHTML='';
  }
  const l={name:p.name,qty:1,price:p.price};
  draft.lines.push(l);
  document.getElementById('lines').appendChild(lineNode(l));
  updateTotal();
};

App.saveCredit=()=>{
  const err=document.getElementById('err'); err.textContent='';
  let amount=0, items=[];

  if(draft.mode==='product'){
    const raw=draft.lines.filter(hasContent);
    if(!raw.length){ err.textContent='অন্তত একটি পণ্য বা দর লিখুন'; return; }

    items=raw.map(l=>({
      name: (l.name||'').trim(),
      qty: effQty(l),
      price: effPrice(l)
    }));
    amount=items.reduce((a,i)=>a+i.qty*i.price,0);

    if(!(amount>0)){
      err.textContent='মোট বিল ০ — অনুগ্রহ করে দর লিখুন, অথবা "সরাসরি টাকা" ট্যাব ব্যবহার করুন';
      return;
    }
  } else {
    const v=parseFloat(document.getElementById('mAmt').value);
    if(!(v>0)){ err.textContent='সঠিক পরিমাণ দিন'; return; }
    amount=v;
  }

  const date=document.getElementById('cDate').value||today();
  const note=document.getElementById('cNote').value.trim();
  state.trans.push({id:uid(),customerId:draft.custId,type:'credit',amount,date,note,items,createdAt:Date.now()});
  save();
  const cid=draft.custId; draft=null;
  home(); go('detail',{id:cid});
};

App.savePay=cid=>{
  const err=document.getElementById('err'); err.textContent='';
  const v=parseFloat(document.getElementById('pAmt').value);
  if(!(v>0)){err.textContent='সঠিক পরিমাণ দিন';return;}
  const date=document.getElementById('pDate').value||today();
  const note=document.getElementById('pNote').value.trim();
  state.trans.push({id:uid(),customerId:cid,type:'payment',amount:v,date,note,items:[],createdAt:Date.now()});
  save(); home(); go('detail',{id:cid});
};

App.delTx=id=>{
  if(!confirm('এই লেনদেন মুছবেন?'))return;
  state.trans=state.trans.filter(t=>t.id!==id);
  save(); render();
};

App.receipt=id=>{const t=state.trans.find(x=>x.id===id);if(!t)return;const c=state.customers.find(x=>x.id===t.customerId);showReceipt(buildCreditReceipt(t),c?c.phone:'');};
App.reminder=cid=>{const c=state.customers.find(x=>x.id===cid);if(!c)return;showReceipt(buildReminder(c),c.phone);};
App.closeModal=()=>{document.getElementById('modal').innerHTML='';};
App.copyReceipt=()=>copy(receiptText);
App.sendWA=()=>{const p=phone880(receiptPhone);if(!p){toast('ফোন নম্বর নেই');return;}window.open('https://wa.me/'+p+'?text='+encodeURIComponent(receiptText),'_blank');};
App.sendSMS=()=>{const p=phone880(receiptPhone);if(!p){toast('ফোন নম্বর নেই');return;}window.location.href='sms:'+p+'?body='+encodeURIComponent(receiptText);};

App.saveProd=()=>{
  const name=document.getElementById('pn').value.trim();
  const price=parseFloat(document.getElementById('pp').value);
  const err=document.getElementById('err'); err.textContent='';
  if(!name){err.textContent='নাম দিন';return;}
  if(!(price>0)){err.textContent='দর ০ এর বেশি';return;}
  if(editP){const p=state.products.find(x=>x.id===editP);if(p){p.name=name;p.price=price;}editP=null;}
  else state.products.push({id:uid(),name,price});
  save(); render();
};
App.editProd=id=>{editP=id;render();window.scrollTo(0,0);};
App.cancelEdit=()=>{editP=null;render();};
App.delProd=id=>{
  const p=state.products.find(x=>x.id===id);if(!p)return;
  if(!confirm(`"${p.name}" মুছবেন?`))return;
  state.products=state.products.filter(x=>x.id!==id);
  if(editP===id)editP=null;
  save();render();
};

App.saveShop=()=>{state.shop=document.getElementById('shop').value.trim()||'আমার দোকান';save();toast('সংরক্ষণ হয়েছে');render();};
App.toggleTheme=()=>{state.theme=state.theme==='dark'?'light':'dark';save();render();};

App.copyBackup=()=>copy(document.getElementById('out').value);
App.restore=()=>{
  const err=document.getElementById('err'); err.textContent='';
  const txt=document.getElementById('in').value.trim();
  if(!txt){err.textContent='JSON পেস্ট করুন';return;}
  let obj; try{obj=JSON.parse(txt);}catch(e){err.textContent='সঠিক JSON নয়';return;}
  if(!obj||!Array.isArray(obj.customers)||!Array.isArray(obj.trans)){err.textContent='ব্যাকআপ সঠিক নয়';return;}
  if(!confirm('সব ডেটা মুছে ব্যাকআপ বসবে। নিশ্চিত?'))return;
  state=Object.assign({shop:'আমার দোকান',theme:'light',customers:[],trans:[],products:[]},obj);
  save();home();toast('রিস্টোর সম্পন্ন');
};

try{
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" rx="96" fill="#1f7a4d"/><text x="256" y="330" font-size="240" text-anchor="middle" font-family="sans-serif" fill="#ffffff">৳</text></svg>`;
  const icon='data:image/svg+xml,'+encodeURIComponent(svg);
  const mf={name:'বাকির খাতা',short_name:'বাকির খাতা',start_url:'.',display:'standalone',
    background_color:'#f2f6f3',theme_color:'#1f7a4d',lang:'bn',
    icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
  const link=document.createElement('link');
  link.rel='manifest';
  link.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
  document.head.appendChild(link);
}catch(e){}

render();
</script>
